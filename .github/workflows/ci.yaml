name: CI
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v3
      - name: Run linters
        run: mise run lint
      - name: Run LuaLS
        run: mise run typecheck
      - name: Check formatting
        run: mise run fmt-check
  test:
    name: Test / Neovim ${{ matrix.neovim }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neovim: [stable, nightly]
    env:
      MISE_NEOVIM_VERSION: ${{ matrix.neovim }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v3
      - name: Install Lua test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y luarocks liblua5.1-0-dev
          sudo luarocks --lua-version=5.1 install busted 2.3.0
          sudo luarocks --lua-version=5.1 install nlua 0.3.2
      - name: Check Neovim version
        run: |
          nlua -e '
            local v = vim.version()
            print("Neovim " .. tostring(v))
            assert((v.prerelease ~= nil) == ${{ matrix.neovim == 'nightly' }}, "expected Neovim ${{ matrix.neovim }}")
          ' < /dev/null
      - name: Run tests
        run: mise run test
