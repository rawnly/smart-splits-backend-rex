[tools]
actionlint = "latest"
"aqua:Kampfkarren/selene" = "latest"
lua-language-server = "latest"
neovim = "latest"
node = "lts"
prettier = "latest"
shellcheck = "latest"
stylua = "latest"
tombi = "latest"
yamlfmt = "latest"

[tasks.deps]
description = "Clone smart-splits core at the pinned revision"
hide = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
dir="deps/smart-splits.nvim"
rev="v3.0.0"
if [ -d "$dir" ] && [ "$(git -C "$dir" rev-parse HEAD 2>/dev/null)" = "$(git -C "$dir" rev-parse "$rev^{commit}" 2>/dev/null)" ]; then
  exit 0
fi
rm -rf "$dir"
mkdir -p deps
git clone --filter=blob:none --no-checkout https://github.com/smart-splits-nvim/smart-splits.nvim "$dir"
git -C "$dir" checkout --quiet "$rev"
'''

[tasks.deps-force]
description = "Force re-clone smart-splits core"
hide = true
run = "rm -rf deps/smart-splits.nvim && mise run deps"

[tasks.test-rex]
description = "Run Rex-side module tests without a live Rex server"
run = "nvim --headless -u NONE -l tests/rex/test.lua"

[tasks.test]
description = "Run all tests"
depends = ["deps", "test-rex"]
run = 'SMART_SPLITS_DIR="$(pwd)/deps/smart-splits.nvim" busted --run=core'

[tasks.fmt-check]
description = "Check formatting"
run = [
  "stylua --check lua rex tests",
  "yamlfmt -gitignore_excludes -dry .",
  'prettier --check "**/*.{json,jsonc}"',
  "tombi format --offline --check .",
]

[tasks.fmt]
description = "Format code"
run = [
  "stylua lua rex tests",
  "yamlfmt -gitignore_excludes .",
  'prettier --write "**/*.{json,jsonc}"',
  "tombi format --offline .",
]

[tasks.lint]
description = "Run linters"
run = ["selene ./lua/ ./tests/", "actionlint"]

[tasks.typecheck]
description = "Run LuaLS type checking"
depends = ["deps"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
tmpdir="$(mktemp -d)"
trap 'rm -rf "$tmpdir"' EXIT
VIMRUNTIME="$(nvim --clean -i NONE --headless --cmd 'lua io.write(vim.env.VIMRUNTIME)' --cmd 'quitall')" \
  lua-language-server --check=. --checklevel=Warning --check_format=pretty --configpath=.luarc.json --logpath="$tmpdir/luals"
'''

[tasks.check]
description = "Run all checks"
depends = ["fmt-check", "lint", "typecheck", "test"]
